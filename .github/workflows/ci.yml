name: CI i wdrożenie

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatowanie
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typy
        run: npm run typecheck
      - name: Testy jednostkowe
        run: npm test
      - name: Przeglądarka do testów e2e
        run: npx playwright install --with-deps chromium
      - name: Testy e2e
        run: npm run e2e
      - name: Raport Playwright przy błędzie
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raport-playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

  budowanie:
    name: Budowanie strony
    needs: testy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_WERSJA: ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  wdrozenie:
    name: Wdrożenie na GitHub Pages
    needs: budowanie
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
