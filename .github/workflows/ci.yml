name: CI i wdrożenie

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatowanie
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typy
        run: npm run typecheck
      - name: Testy jednostkowe
        run: npm test
      - name: Przeglądarki do testów e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Testy e2e
        env:
          EKSPORT_PRZEGLADARKI: '1'
        run: npm run e2e
      - name: Raport Playwright przy błędzie
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raport-playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

  budowanie:
    name: Budowanie strony
    needs: testy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_WERSJA: ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  wdrozenie:
    name: Wdrożenie na GitHub Pages
    needs: budowanie
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Sprawdzenie strony po wdrożeniu
        env:
          ADRES: ${{ steps.deploy.outputs.page_url }}
          WERSJA: ${{ github.sha }}
        run: |
          # Strona z TEGO commita (meta „wersja”), jej skrypt główny, czcionka pakietu i strona
          # instrukcji muszą odpowiadać. CDN Pages bywa opóźniony – kilka prób.
          host=$(echo "$ADRES" | grep -oE '^https?://[^/]+')
          # Sprawdza stronę HTML (plik, adres strony): jej skrypt główny (<script type="module">)
          # i arkusze stylów muszą się pobierać. Brak skryptu albo stylów to błąd.
          sprawdz_zasoby() {
            local plik="$1" baza="$2" skrypty style adres
            skrypty=$(grep -oE '<script type="module"[^>]*src="[^"]+"' "$plik" | sed -E 's/.*src="([^"]+)"/\1/')
            style=$(grep -oE '<link rel="stylesheet"[^>]*href="[^"]+"' "$plik" | sed -E 's/.*href="([^"]+)"/\1/')
            [ -n "$skrypty" ] && [ -n "$style" ] || return 1
            for adres in $skrypty $style; do
              case "$adres" in
                /*) adres="$host$adres" ;;
                *) adres="${baza%/}/${adres#./}" ;;
              esac
              curl -fsS -o /dev/null "$adres" || return 1
            done
          }
          for proba in $(seq 1 9); do
            sleep 20
            curl -fsS -H 'Cache-Control: no-cache' "$ADRES" -o strona.html || continue
            grep -q "name=\"wersja\" content=\"$WERSJA\"" strona.html || continue
            sprawdz_zasoby strona.html "$ADRES" || continue
            curl -fsS -o /dev/null "${ADRES%/}/czcionki/EBGaramond-Regular.ttf" || continue
            # Strona instrukcji (druga strona wejściowa) pod bazą i jej zrzut ekranu.
            curl -fsS -H 'Cache-Control: no-cache' "${ADRES%/}/instrukcja/" -o instrukcja.html || continue
            grep -q "name=\"wersja\" content=\"$WERSJA\"" instrukcja.html || continue
            sprawdz_zasoby instrukcja.html "${ADRES%/}/instrukcja/" || continue
            curl -fsS -o /dev/null "${ADRES%/}/instrukcja-zrzuty/pl/start.png" || continue
            echo "OK: $ADRES ($WERSJA)"
            exit 0
          done
          echo "Strona $ADRES nie odpowiada poprawnie albo nie ma wersji $WERSJA"
          exit 1
