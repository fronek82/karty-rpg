<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Wariant: drukarnia riso – ciemny</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#17171A}
a{color:#E9E4D8}a:hover{color:#8FB0D1}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 100vh; background: #17171A; color: #E9E4D8; font-family: Archivo, sans-serif; font-size: 14px; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 28px 40px 20px; border-bottom: 3px solid #E9E4D8">
    <div style="display: flex; align-items: flex-end; gap: 18px">
      <div style="position: relative; width: 52px; height: 64px">
        <div style="position: absolute; left: 8px; top: 0; width: 40px; height: 56px; background: #B8675A; mix-blend-mode: screen; border-radius: 3px"></div>
        <div style="position: absolute; left: 0; top: 8px; width: 40px; height: 56px; background: #3F6A93; mix-blend-mode: screen; border-radius: 3px"></div>
      </div>
      <div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em">KREATOR KART RPG · v2.4</div>
        <div style="font-family: 'Archivo Black', sans-serif; font-size: 44px; line-height: 0.95; letter-spacing: -0.02em">KARTY RPG</div>
      </div>
    </div>
    <nav style="display: flex; gap: 8px; flex-wrap: wrap">
      <button type="button" style="height: 44px; padding: 0 16px; background: transparent; color: #E9E4D8; border: 2px solid #E9E4D8; border-radius: 0; font-weight: 700">Biblioteka</button>
      <button type="button" style="height: 44px; padding: 0 16px; background: transparent; color: #E9E4D8; border: 2px solid #E9E4D8; border-radius: 0; font-weight: 700">Ustawienia</button>
      <button type="button" style="height: 44px; padding: 0 16px; background: transparent; color: #E9E4D8; border: 2px solid #E9E4D8; border-radius: 0; font-weight: 700">Kopia i import</button>
    </nav>
  </header>

  <div style="display: flex; flex-wrap: wrap; flex-grow: 1">
    <aside style="flex: 1 1 280px; max-width: 340px; box-sizing: border-box; padding: 32px 28px 32px 40px; border-right: 3px solid #E9E4D8; display: flex; flex-direction: column; gap: 28px">
      <button type="button" style="position: relative; text-align: left; padding: 22px 20px; background: #E8B4A8; color: #17171A; border: 2px solid #E9E4D8; box-shadow: 6px 6px 0 #3F6A93">
        <div style="font-family: 'Archivo Black', sans-serif; font-size: 26px; line-height: 1">+ NOWE<br>KARTY</div>
        <div style="margin-top: 10px; font-size: 13px; font-weight: 500">Dowolny rozmiar, pola, ramki i wzory</div>
      </button>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.1em">GOTOWE UKŁADY</div>
        <button type="button" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #202024; color: #E9E4D8; border: 2px solid #E9E4D8; text-align: left">
          <span><span style="display: block; font-weight: 700; font-size: 15px">Mausritter A4</span><span style="font-size: 12px">kafelki 41×63 mm</span></span>
          <span style="font-family: 'Archivo Black', sans-serif; font-size: 20px">→</span>
        </button>
        </div>

      <a href="https://buymeacoffee.com/fronek82" style="margin-top: auto; display: block; padding: 14px 16px; border: 2px dashed #E9E4D8; color: #E9E4D8; text-decoration: none">
        <span style="display: block; font-weight: 700">Postaw kawę twórcy</span>
        <span style="font-size: 12px">Wspieraj darmowe narzędzia RPG</span>
      </a>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 2px solid #E9E4D8; padding-bottom: 12px">
        <div style="display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap">
          <h1 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 32px">Moje projekty <span style="color: #8FB0D1">03</span></h1>
          <button type="button" style="background: none; border: none; padding: 8px 0; color: #E9E4D8; font-weight: 500; text-decoration: underline">Szablony (2)</button>
          <button type="button" style="background: none; border: none; padding: 8px 0; color: #E9E4D8; font-weight: 500; text-decoration: underline">Arkusze do druku</button>
        </div>
        <label style="display: flex; align-items: center; gap: 8px; border: 2px solid #E9E4D8; height: 40px; padding: 0 12px; background: #202024">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">SZUKAJ</span>
          <input type="search" style="width: 180px; border: none; outline: none; background: transparent; color: #E9E4D8">
        </label>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 36px 28px">
        <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
          <article style="display: flex; flex-direction: column; gap: 14px; height: 100%">
            <div style="position: relative; height: 220px; display: flex; align-items: center; justify-content: center; background: #202024; border: 2px solid #E9E4D8">
              <div style="position: absolute; left: 10px; top: 10px; width: 14px; height: 14px; border-left: 1.5px solid #E9E4D8; border-top: 1.5px solid #E9E4D8"></div>
              <div style="position: absolute; right: 10px; top: 10px; width: 14px; height: 14px; border-right: 1.5px solid #E9E4D8; border-top: 1.5px solid #E9E4D8"></div>
              <div style="position: absolute; left: 10px; bottom: 10px; width: 14px; height: 14px; border-left: 1.5px solid #E9E4D8; border-bottom: 1.5px solid #E9E4D8"></div>
              <div style="position: absolute; right: 10px; bottom: 10px; width: 14px; height: 14px; border-right: 1.5px solid #E9E4D8; border-bottom: 1.5px solid #E9E4D8"></div>
              <div style="position: relative; width: {{ p.pw }}; height: {{ p.ph }}">
                <div style="position: absolute; left: 8px; top: 6px; width: 100%; height: 100%; background: {{ p.c2 }}; mix-blend-mode: screen"></div>
                <div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: {{ p.c1 }}; mix-blend-mode: screen; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', sans-serif; font-size: 34px; color: #17171A">{{ p.glyph }}</div>
              </div>
              <span style="position: absolute; right: 14px; bottom: 30px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; background: #E9E4D8; color: #17171A; padding: 3px 6px">{{ p.size }}</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px"><span>{{ p.format }}</span><span>{{ p.when }}</span></div>
            <h3 style="margin: 0; min-height: 46px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-family: 'Archivo Black', sans-serif; font-size: 20px; line-height: 1.15">{{ p.name }}</h3>
            <div style="font-size: 13px">{{ p.meta }}</div>
            <div style="display: flex; gap: 0; margin-top: auto">
              <button type="button" style="flex-grow: 1; height: 44px; background: #E9E4D8; color: #17171A; border: 2px solid #E9E4D8; font-weight: 700">Otwórz</button>
              <button type="button" style="height: 44px; padding: 0 18px; background: #202024; color: #E9E4D8; border: 2px solid #E9E4D8; border-left: none; font-weight: 700">Drukuj</button>
            </div>
          </article>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      projects: [
        { name: 'Talia ekwipunku Mausritter', format: 'MAUSRITTER', size: '41×63', when: '2 GODZ. TEMU', meta: '36 kart · 2 arkusze A4', pw: '80px', ph: '122px', c1: '#B8973F', c2: '#3F6A93', glyph: '⚔' },
        { name: 'Karty zaklęć maga – krąg 1–3', format: 'POKER', size: '63×88', when: 'WCZORAJ', meta: '54 karty · 6 arkuszy A4', pw: '96px', ph: '134px', c1: '#B8675A', c2: '#B8973F', glyph: '✦' },
        { name: 'Bestiariusz: Bestie z Lasu Mgieł i Bagien Północy', format: 'MINI EURO', size: '44×67', when: '3 DNI TEMU', meta: '18 kart · 1 arkusz A4', pw: '84px', ph: '126px', c1: '#5F8A5C', c2: '#B8675A', glyph: '◆' }
      ]
    };
  }
}
</script>
</body>
</html>
