<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="description"
      content="Projektowanie i drukowanie kart do gier RPG i planszowych – w całości w przeglądarce."
    />
    <meta name="wersja" content="%VITE_WERSJA%" />
    <script>
      // Motyw przed pierwszym malowaniem (bez migotania); logika jak w src/ui/motyw.ts.
      try {
        var m = localStorage.getItem('karty.motyw');
        var c = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', c ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <title>Karty RPG</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Karty RPG działają w przeglądarce i wymagają włączonego JavaScriptu.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
